name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add new packages here (e.g. `server`) as they are created.
        package: [frontend, database, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Cache mongodb-memory-server binary
        if: matrix.package != 'frontend'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', matrix.package)) }}

      - run: npm ci
      # server loads Mongoose models from ../database, which resolve their own deps there.
      - name: Install database package for server
        if: matrix.package == 'server'
        run: npm ci --prefix ../database
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build --if-present

  # Full-stack browser tests: real API + mongodb-memory-server + Vite (PBI-34).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            database/package-lock.json
            server/package-lock.json
            frontend/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json', 'database/package-lock.json') }}

      # No install scripts run; mongodb-memory-server downloads mongod lazily on
      # first use into the cached ~/.cache/mongodb-binaries instead.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefix database
          npm ci --ignore-scripts --prefix server
          npm ci --ignore-scripts --prefix frontend

      # Uses the Playwright version pinned in frontend/package-lock.json.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npm run test:e2e:install

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            frontend/playwright-report/e2e/
            frontend/test-results/
          retention-days: 14
