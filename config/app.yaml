# Historical planning reference only. No application code loads this file.
# Runtime configuration uses root .env / environment variables; see .env.example.
app:
  name: "SideQuest"
  environment: "development"

server:
  host: "0.0.0.0"
  port: 5000

client:
  port: 3000

database:
  type: "mongodb"
  uri: "mongodb://localhost:27017/sidequest_dev"
  name: "sidequest_dev"

auth:
  jwt_secret: "REPLACE_ME"
  jwt_expiry: "7d"

logging:
  level: "info"
  format: "json"

cors:
  allowed_origins:
    - "http://localhost:3000"
